# cinch's own harness manifest (D036/D055): cinch is the task-primitive's
# first consumer. The shared template set binds to the same keys any consumer
# must declare — a CLI repo answers them the honest way (no dev servers, no
# test-tier duplication), which is exactly the portability question being asked.
# Domain rules live in .agent/domain/ (D062).
harness_version: 0.1.0

paths:
  domain: .agent/domain # cinch's domain: rendering, checking, templating
  audit: .agent/audit/coverage.md # committed rule-coverage audit report (C15)
  tests:
    integration: tests
    unit: tests
    e2e: tests

development:
  commands:
    check: ./bin/cinch check # self-check: the harness guards its own repo
    check-harness: ./bin/cinch check # alias: the template binding both consumers share
    test: go test ./...
    test-backend: go test ./...
    test-e2e: go test ./...
    docs-index: ./bin/cinch index # regenerate .agent/index.md
    ignores: ./bin/cinch ignores # the cinch:ignore N/A inventory (check-rules step 1)

taxonomy:
  layers: [core]
  test_tiers:
    - { id: integration, tdd: rule-tests, cmd: test-backend }
    - { id: e2e, tdd: never, opt_in: true, cmd: test-e2e, notes: .agent/e2e.md }
    - { id: manual, automatable: false }

# D067 — seams carry an allow: list of development.commands ids; C12 validates
# the shape. Declaration gates nothing by itself — enforcement is per-harness glue.
seams:
  planner: { tier: strong, max_task_layers: 1, allow: [check, test] }
  executor: { tier: any, max_task_layers: 1, allow: [check, test] }
  doc_maintainer: { tier: mid, allow: [check, docs-index] }
  auditor: { tier: strong, allow: [check-harness, check, ignores] }
