# CI for the cinch repo. Dormant until the repo is pushed somewhere (O005).

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Build, vet, and test
        run: make test
