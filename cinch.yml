paths:
  docs: .docs
  hooks: .githooks
  exclude:
    # marker-shaped test fixtures, not real bindings
    - internal/cinch/rules_test.go
    - internal/cinch/hook_test.go
    - internal/cinch/impact_test.go
    - internal/cinch/rules_json_test.go

hooks:
  # generated is left out locally: the shims exec the installed cinch, whose
  # embedded templates can lag the source being edited. CI runs the full set from source.
  pre-commit-checks: [links, rules, index, core]
  # commit.pattern is unset: scripts/check-squash-merge-msg.sh checks messages instead.
  commit-msg-checks: []
  commit-msg:
    conventions:
      run: scripts/check-squash-merge-msg.sh
  post-commit:
    version-bump:
      run: scripts/post-commit-version-bump.sh

# any: hooks run the installed binary while CI runs from source, so a
# version pin here would only churn.
require:
  cinch: any
