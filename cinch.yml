paths:
  docs: .docs
  hooks: .githooks
  exclude:
    # marker-shaped test fixtures, not real bindings
    - internal/cinch/rules_test.go
    - internal/cinch/hook_test.go
    - internal/cinch/impact_test.go
    - internal/cinch/rules_json_test.go
    # upkeep reference solutions: marker-shaped lines inside patches for another repo
    - bench/upkeep/tasks/*/reference.patch
    # field log: cinch's own finding text quoted from other repos' logs, and the test inputs for it
    - bench/field/*.csv
    - bench/field/main_test.go
    # drift census: audit reports quoting markers and suggested tests for other repos
    - bench/drift/
    # leak replay: DeltaDocs rule IDs quoted in states, patches, hidden tests and probes
    - bench/leak/

# .docs/git-conventions.md § Commit message shapes. The squash entries apply
# only while $GIT_DIR/SQUASH_MSG exists; the release cut (git merge --no-ff)
# keeps git's own merge subject.
commit:
  pattern: '^(feat|fix|ui|docs|style|refactor|test|chore|perf)(!)?( \[[a-z+-]+\])?: .+'
  squash:
    dev: '^merge: (feature|refactor|fix|chore|docs|perf|ui)/.+'
    main: '^merge: hotfix/.+'
  merge: exempt

hooks:
  # generated is left out locally: the shims exec the installed cinch, whose
  # embedded templates can lag the source being edited. CI runs the full set from source.
  pre-commit-checks: [links, rules, index, core]
  post-commit:
    version-bump:
      run: scripts/post-commit-version-bump.sh

# any: hooks run the installed binary while CI runs from source, so a
# version pin here would only churn.
require:
  cinch: any
